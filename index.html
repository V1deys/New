<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videy Viral</title>

<style>
body {
    margin: 0;
    background: #000;
    text-align: center;
    color: #fff;
    font-family: Arial;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.video-wrapper {
    position: relative;
    cursor: pointer;
}

.video-wrapper iframe {
    width: 100%;
    height: 450px;
    border-radius: 10px;
}

/* Overlay transparan untuk nangkap klik */
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
}
</style>
</head>

<body>

<div class="container">
    <h2>🔥 Videy Viral Hari Ini 🔥</h2>

    <div class="video-wrapper" onclick="openAd()">
        <iframe id="videoFrame"
            src="video1"
            allowfullscreen>
        </iframe>
        <div class="overlay"></div>
    </div>
</div>

<script>
let sudahKlik = false;

function openAd() {
    if (!sudahKlik) {
        window.open("https://injusticebakery.com/cz9v6wbtd?key=f8a454d7118e3225cb72a14af52be10c", "_blank");
        sudahKlik = true;
    }

    // Play video setelah klik pertama
    let iframe = document.getElementById("videoFrame");
    iframe.src += "&autoplay=1";
}
</script>

</body>
  </html>
